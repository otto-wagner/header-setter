<!doctype html>
<!-- Light unless the stored preference says otherwise, so the popup never starts in a
     scheme the user did not pick. popup.js overwrites this from storage on open. -->
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <title>Header Setter</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="app-bar">
      <img class="brand-icon" src="../../icons/icon48.png" alt="" width="18" height="18" />
      <h1 class="app-title">Header Setter</h1>
      <div class="master-switch">
        <span id="enabledLabel" class="master-label">On</span>
        <label class="toggle-switch">
          <input
            id="enabledToggle"
            type="checkbox"
            aria-label="Enable or disable Header Setter"
            checked
          />
          <span class="toggle-slider"></span>
        </label>
      </div>
      <button
        id="themeToggle"
        class="icon-btn"
        type="button"
        title="Dark mode"
        aria-label="Switch to dark mode"
      >
        <!-- Which of the two is on screen is decided in CSS by .is-dark on the button:
             the hidden attribute is an HTMLElement property and does nothing on SVG. -->
        <svg class="theme-icon moon filled" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20.7 14.6A9 9 0 0 1 9.4 3.3a9 9 0 1 0 11.3 11.3Z" />
        </svg>
        <svg class="theme-icon sun stroked" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="4" />
          <path
            d="M12 2.5v1.8M12 19.7v1.8M4.4 4.4l1.3 1.3M18.3 18.3l1.3 1.3M2.5 12h1.8M19.7 12h1.8M4.4 19.6l1.3-1.3M18.3 5.7l1.3-1.3"
          />
        </svg>
      </button>
    </header>

    <form id="composer" class="composer" novalidate>
      <div class="type-switch" role="radiogroup" aria-label="What to add">
        <label class="type-option">
          <input type="radio" name="entryType" value="header" checked />
          <span>Header</span>
        </label>
        <label class="type-option">
          <input type="radio" name="entryType" value="cookie" />
          <span>Cookie</span>
        </label>
      </div>

      <div id="pairFields" class="field-group">
        <label class="field">
          <span class="field-label">
            Domain
            <span class="field-actions">
              <button id="cancelPairEdit" class="link-btn" type="button" hidden>
                Cancel edit
              </button>
              <button id="useCurrentSite" class="link-btn" type="button" hidden></button>
            </span>
          </span>
          <input
            id="domain"
            name="domain"
            placeholder="e.g. httpbingo.org"
            autocomplete="off"
          />
        </label>
        <div class="field-row">
          <label class="field">
            <span class="field-label" id="nameLabel">Header name</span>
            <input
              id="entryName"
              name="entryName"
              placeholder="e.g. User-Agent"
              autocomplete="off"
            />
          </label>
          <label class="field field-wide">
            <span class="field-label" id="valueLabel">Header value</span>
            <input
              id="entryValue"
              name="entryValue"
              placeholder="e.g. Mozilla/5.0 (Windows NT 10.0; Win64; x64) App..."
              autocomplete="off"
            />
          </label>
        </div>
      </div>

      <div id="headerNotice" class="notice notice-warn" role="status" hidden></div>

      <div id="routeFields" class="field-group" hidden>
        <div class="field-label block-label">
          Proxy
          <span class="field-actions">
            <button id="cancelRouteEdit" class="link-btn" type="button" hidden>
              Cancel edit
            </button>
            <button id="useCurrentRoute" class="link-btn" type="button" hidden></button>
          </span>
        </div>
        <div class="field-row">
          <label class="field">
            <span class="field-label">from</span>
            <input
              id="routeFrom"
              name="routeFrom"
              placeholder="e.g. staging.httpbin.org"
              autocomplete="off"
            />
          </label>
          <label class="field field-wide">
            <span class="field-label">to</span>
            <input
              id="routeTo"
              name="routeTo"
              placeholder="e.g. httpbin.org"
              autocomplete="off"
            />
          </label>
        </div>
        <p class="field-hint">
          Over <code>https://</code> both hosts must share a certificate,
          otherwise the browser reports
          <code>ERR_CERT_COMMON_NAME_INVALID</code>; over
          <code>http://</code> any pair works.
        </p>
      </div>

      <p id="formError" class="form-error" role="alert" hidden></p>
      <button id="submitBtn" class="primary" type="submit">Add</button>
    </form>

    <section class="list-section">
      <!-- No heading: every block below names its own host. The proxy status is all
           that is left above the list, and only while a route makes it relevant. -->
      <span id="proxyStatus" class="proxy-status checking" role="status" hidden
        >Checking proxy…</span
      >
      <div id="proxyBanner" class="notice notice-warn" role="status" hidden></div>
      <div id="groups" class="groups" aria-live="polite"></div>
      <p id="emptyState" class="empty-state">
        No headers, cookies or routes yet.
      </p>
    </section>

    <footer class="app-footer">
      <a
        href="https://github.com/otto-wagner/header-setter"
        target="_blank"
        rel="noopener noreferrer"
      >
        <svg class="github-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M12 .3a12 12 0 0 0-3.8 23.4c.6.1.8-.3.8-.6v-2.2c-3.3.7-4-1.4-4-1.4-.5-1.4-1.3-1.8-1.3-1.8-1.1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1.1 1.8 2.8 1.3 3.5 1 .1-.8.4-1.3.7-1.6-2.7-.3-5.5-1.4-5.5-6a4.7 4.7 0 0 1 1.2-3.3c-.1-.3-.5-1.6.1-3.3 0 0 1-.3 3.4 1.2a11.8 11.8 0 0 1 6.2 0c2.4-1.5 3.4-1.2 3.4-1.2.6 1.7.2 3 .1 3.3a4.7 4.7 0 0 1 1.2 3.3c0 4.6-2.8 5.7-5.5 6 .4.3.8 1 .8 2v2.8c0 .3.2.7.8.6A12 12 0 0 0 12 .3"
          />
        </svg>
        <span>Open source on GitHub</span>
      </a>
      <a
        href="https://github.com/sponsors/otto-wagner"
        target="_blank"
        rel="noopener noreferrer"
      >
        <svg class="sponsor-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1.1L12 21.3l7.8-7.8 1.1-1.1a5.5 5.5 0 0 0-.1-7.8Z"/>
        </svg>
        <span>Support on GitHub Sponsors</span>
      </a>
    </footer>

    <script type="module" src="popup.js"></script>
  </body>
</html>
